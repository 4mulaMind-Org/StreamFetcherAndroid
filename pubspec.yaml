name: stream_fetcher_android
description: "A Flutter application for video downloading with quality options."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_downloader: ^1.11.7
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  http: ^1.2.0
  youtube_explode_dart: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - x.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "x.png"